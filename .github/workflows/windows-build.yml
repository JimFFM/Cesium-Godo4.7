name: Windows Double & Single Precision Builds

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  build-extension:
    name: Build Godot3DTiles (${{ matrix.precision }} Precision)
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        precision: [single, double]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Checkout pinned vcpkg source
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        ref: dbe35ceb30c688bf72e952ab23778e009a578f18
        path: .ezvcpkg/${{ matrix.precision }}-dbe35ceb30c688bf72e952ab23778e009a578f18
        fetch-depth: 1
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install SCons
      run: pip install scons

    - name: Setup MSVC 2022
      uses: microsoft/setup-msbuild@v1.3
      with:
        vs-version: '17.7'

    - name: Pre-setup vcpkg and globally disable MSYS2 pkgconfig fixups
      shell: powershell
      run: |
        $vcpkgCommit = "dbe35ceb30c688bf72e952ab23778e009a578f18"
        $workspaceVcpkgDir = Join-Path $env:GITHUB_WORKSPACE ".ezvcpkg\${{ matrix.precision }}-$vcpkgCommit"
        $vcpkgRoot = Join-Path $env:USERPROFILE ".ezvcpkg"
        $vcpkgDir = Join-Path $vcpkgRoot "${{ matrix.precision }}-$vcpkgCommit"
        New-Item -ItemType Directory -Force -Path $vcpkgRoot | Out-Null

        if (-not (Test-Path $workspaceVcpkgDir)) {
            throw "Pinned vcpkg checkout not found at expected path: $workspaceVcpkgDir"
        }

        if (Test-Path $vcpkgDir) {
            Remove-Item -Recurse -Force $vcpkgDir
        }

        New-Item -ItemType Directory -Force -Path $vcpkgDir | Out-Null
        robocopy $workspaceVcpkgDir $vcpkgDir /E /COPY:DAT /R:3 /W:5 /NFL /NDL /NJH /NJS /NP
        $robocopyExitCode = $LASTEXITCODE
        if ($robocopyExitCode -gt 7) {
            throw "robocopy failed with exit code $robocopyExitCode"
        }
        $global:LASTEXITCODE = 0

        & "$env:GITHUB_WORKSPACE\.github\scripts\disable-vcpkg-fixup-pkgconfig.ps1" -VcpkgDir $vcpkgDir

    - name: Build Extension (${{ matrix.precision }} Precision)
      run: scons platform=windows arch=x64 compileTarget=extension target=template_release buildCesium=true precision=${{ matrix.precision }}

    - name: Verify Build Output
      run: if ((gci godot3dtiles/addons/cesium_godot/lib -Filter "*.dll").Count -lt 1) { exit 1 }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: godot3dtiles-${{ matrix.precision }}-precision-dev
        path: godot3dtiles/
