name: Windows Double & Single Precision Builds Sep2026-v5

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  build-extension:
    name: Build Godot3DTiles (${{ matrix.precision }} Precision)
    runs-on: windows-latest
    
    strategy:
      fail-fast: false
      matrix:
        precision: [single, double]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install SCons
      run: pip install scons

    - name: Setup MSVC 2022
      uses: microsoft/setup-msbuild@v1.3
      with:
        vs-version: '17.7'
        include-optional: true

    - name: Pre-setup vcpkg and globally disable MSYS2 pkgconfig fixups
      shell: powershell
      run: |
        $vcpkgDir = "D:\.ezvcpkg\dbe35ceb30c688bf72e952ab23778e009a578f18"
        New-Item -ItemType Directory -Force -Path $vcpkgDir
        
        Write-Host "Cloning official vcpkg repository..."
        git clone https://github.com/microsoft/vcpkg.git $vcpkgDir
        
        Set-Location $vcpkgDir
        Write-Host "Checking out expected commit: dbe35ceb30c688bf72e952ab23778e009a578f18"
        git checkout dbe35ceb30c688bf72e952ab23778e009a578f18
        
        # Globally neutralize vcpkg_fixup_pkgconfig to prevent ANY package from triggering MSYS2 downloads
        $pkgConfigScript = Join-Path$vcpkgDir "scripts\cmake\vcpkg_fixup_pkgconfig.cmake"
        if (Test-Path $pkgConfigScript) {
            Write-Host "Globally bypassing vcpkg_fixup_pkgconfig in $pkgConfigScript..."
            Set-Content -Path $pkgConfigScript -Value "function(vcpkg_fixup_pkgconfig)%`nendfunction()%`n"
            Write-Host "Successfully disabled pkgconfig fixup globally!"
        } else {
            Write-Warning "vcpkg_fixup_pkgconfig.cmake not found at expected path."
        }

    - name: Build Extension (${{ matrix.precision }} Precision)
      run: scons platform=windows arch=x64 compileTarget=extension target=template_release buildCesium=true precision=${{ matrix.precision }}

    - name: Verify Build Output
      run: if ((gci godot3dtiles/addons/cesium_godot/lib -Filter "*.dll").Count -lt 1) { exit 1 }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: godot3dtiles-${{ matrix.precision }}-precision-dev
        path: godot3dtiles/
