name: Windows Double & Single Precision Builds

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  build-extension:
    name: Build Godot3DTiles (${{ matrix.precision }} Precision)
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        precision: [single, double]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install SCons
      run: pip install scons

    - name: Setup MSVC 2022
      uses: microsoft/setup-msbuild@v1.3
      with:
        vs-version: '17.7'

    - name: Pre-setup vcpkg and globally disable MSYS2 pkgconfig fixups
      shell: powershell
      run: |
        $vcpkgCommit = "dbe35ceb30c688bf72e952ab23778e009a578f18"
        $vcpkgRoot = Join-Path $env:USERPROFILE ".ezvcpkg"
        $vcpkgDir = Join-Path $vcpkgRoot "${{ matrix.precision }}-$vcpkgCommit"
        New-Item -ItemType Directory -Force -Path $vcpkgRoot | Out-Null

        if (Test-Path $vcpkgDir) {
            Remove-Item -Recurse -Force $vcpkgDir
        }

        Write-Host "Fetching pinned vcpkg commit: $vcpkgCommit"
        git init $vcpkgDir
        Set-Location $vcpkgDir
        git remote add origin https://github.com/microsoft/vcpkg.git
        git fetch --depth 1 origin $vcpkgCommit
        git checkout FETCH_HEAD

        # Globally neutralize vcpkg_fixup_pkgconfig to prevent ANY package from triggering MSYS2 downloads
        $pkgConfigScript = "$vcpkgDir\scripts\cmake\vcpkg_fixup_pkgconfig.cmake"

        if (Test-Path $pkgConfigScript) {
            Write-Host "Globally bypassing vcpkg_fixup_pkgconfig in $pkgConfigScript..."
            $overrideFunction = "function(vcpkg_fixup_pkgconfig)`nendfunction()`n"
            Set-Content -Path $pkgConfigScript -Value $overrideFunction
            Write-Host "Successfully disabled pkgconfig fixup globally!"
        } else {
            throw "vcpkg_fixup_pkgconfig.cmake not found at expected path: $pkgConfigScript"
        }

    - name: Build Extension (${{ matrix.precision }} Precision)
      run: scons platform=windows arch=x64 compileTarget=extension target=template_release buildCesium=true precision=${{ matrix.precision }}

    - name: Verify Build Output
      run: if ((gci godot3dtiles/addons/cesium_godot/lib -Filter "*.dll").Count -lt 1) { exit 1 }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: godot3dtiles-${{ matrix.precision }}-precision-dev
        path: godot3dtiles/
