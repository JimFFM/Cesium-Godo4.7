name: Windows Double & Single Precision Builds Sep2026-v3

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  EZVCPKG_BASEDIR: "D:/.ezvcpkg"

jobs:
  build-extension:
    name: Build Godot3DTiles (${{ matrix.precision }} Precision)
    runs-on: windows-latest
    
    strategy:
      fail-fast: false
      matrix:
        precision: [single, double]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install SCons
      run: pip install scons

    - name: Setup MSVC 2022
      uses: microsoft/setup-msbuild@v1.3
      with:
        vs-version: '17.7'
        include-optional: true

    - name: Inject working vcpkg commit for ezvcpkg
      shell: bash
      run: |
        # Target path where ezvcpkg looks for the requested commit hash
        TARGET_DIR="D/.ezvcpkg/dbe35ceb30c688bf72e952ab23778e009a578f18"
        mkdir -p "$TARGET_DIR"
        
        # Clone working vcpkg commit (contains valid MSYS2 URLs) directly into ezvcpkg's expected folder
        git clone https://github.com/microsoft/vcpkg.git "$TARGET_DIR"
        cd "$TARGET_DIR"
        git checkout 7c4b1265fa316d3e8e19b51cdbf3a71b2a6549c4

    - name: Build Extension (${{ matrix.precision }} Precision)
      run: scons platform=windows arch=x64 compileTarget=extension target=template_release buildCesium=true precision=${{ matrix.precision }}

    - name: Verify Build Output
      run: if ((gci godot3dtiles/addons/cesium_godot/lib -Filter "*.dll").Count -lt 1) { exit 1 }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: godot3dtiles-${{ matrix.precision }}-precision-dev
        path: godot3dtiles/

