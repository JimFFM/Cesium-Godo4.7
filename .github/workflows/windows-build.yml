name: Windows Double & Single Precision Builds Sep2026

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  build-extension:
    name: Build Godot3DTiles (${{ matrix.precision }} Precision)
    runs-on: windows-latest
    
    # Run both single and double precision builds in parallel
    strategy:
      fail-fast: false
      matrix:
        precision: [single, double]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # Ensures godot-cpp is fetched correctly

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install SCons
      run: pip install scons

    - name: Setup MSVC 2022
      uses: microsoft/setup-msbuild@v1.3
      with:
        vs-version: '17.7'
        include-optional: true

    - name: Cache ezvcpkg
      uses: actions/cache@v4
      with:
        path: ~/.ezvcpkg
        # Bumping to v2 will force a fresh download the first time it runs
        key: ${{ runner.os }}-ezvcpkg-v2-${{ hashFiles('**/CMakeLists.txt') }}

    - name: Pre-clone and patch Cesium Native to fix vcpkg
      shell: bash
      run: |
        # Pre-clone the commit that build.py expects so build.py skips cloning
        mkdir -p cesium_godot/native
        git clone https://github.com/CesiumGS/cesium-native.git cesium_godot/native
        cd cesium_godot/native
        git checkout 9f6ae299e2709f866db52c4be29b6c31e10718c8
        
        # Patch the ezvcpkg hash to a newer version that fixes MSYS2 404 links
        sed -E -i 's/COMMIT "[a-f0-9]{40}"/COMMIT "7c4b1265fa316d3e8e19b51cdbf3a71b2a6549c4"/g' cmake/ezvcpkg/ezvcpkg.cmake

    - name: Build Extension (${{ matrix.precision }} Precision)
      # Pass the matrix variable directly into the SCons command
      run: scons platform=windows arch=x64 compileTarget=extension target=template_release buildCesium=true precision=${{ matrix.precision }}

    - name: Verify Build Output
      run: if ((gci godot3dtiles/addons/cesium_godot/lib -Filter "*.dll").Count -lt 1) { exit 1 }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: godot3dtiles-${{ matrix.precision }}-precision-dev
        path: godot3dtiles/
