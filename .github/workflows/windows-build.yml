name: Windows Double & Single Precision Builds

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  build-extension:
    name: Build Godot3DTiles (${{ matrix.precision }} Precision)
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        precision: [single, double]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install SCons
      run: pip install scons

    - name: Setup MSVC 2022
      uses: microsoft/setup-msbuild@v1.3
      with:
        vs-version: '17.7'

    - name: Pre-setup vcpkg and globally disable MSYS2 pkgconfig fixups
      shell: powershell
      run: |
        $vcpkgCommit = "dbe35ceb30c688bf72e952ab23778e009a578f18"
        $vcpkgRoot = Join-Path $env:USERPROFILE ".ezvcpkg"
        $vcpkgDir = Join-Path $vcpkgRoot "${{ matrix.precision }}-$vcpkgCommit"
        $archivePath = Join-Path $env:RUNNER_TEMP "${{ matrix.precision }}-$vcpkgCommit.zip"
        $extractRoot = Join-Path $env:RUNNER_TEMP "${{ matrix.precision }}-vcpkg-extract"
        New-Item -ItemType Directory -Force -Path $vcpkgRoot | Out-Null

        if (Test-Path $vcpkgDir) {
            Remove-Item -Recurse -Force $vcpkgDir
        }

        if (Test-Path $archivePath) {
            Remove-Item -Force $archivePath
        }

        if (Test-Path $extractRoot) {
            Remove-Item -Recurse -Force $extractRoot
        }

        Write-Host "Downloading pinned vcpkg archive for commit: $vcpkgCommit"
        Invoke-WebRequest -Uri "https://github.com/microsoft/vcpkg/archive/$vcpkgCommit.zip" -OutFile $archivePath
        Expand-Archive -Path $archivePath -DestinationPath $extractRoot

        $expandedDir = Get-ChildItem -Path $extractRoot -Directory | Select-Object -First 1
        if (-not $expandedDir) {
            throw "Failed to extract vcpkg archive from $archivePath"
        }

        Move-Item -Path $expandedDir.FullName -Destination $vcpkgDir

        & "$env:GITHUB_WORKSPACE\.github\scripts\disable-vcpkg-fixup-pkgconfig.ps1" -VcpkgDir $vcpkgDir

    - name: Build Extension (${{ matrix.precision }} Precision)
      run: scons platform=windows arch=x64 compileTarget=extension target=template_release buildCesium=true precision=${{ matrix.precision }}

    - name: Verify Build Output
      run: if ((gci godot3dtiles/addons/cesium_godot/lib -Filter "*.dll").Count -lt 1) { exit 1 }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: godot3dtiles-${{ matrix.precision }}-precision-dev
        path: godot3dtiles/
