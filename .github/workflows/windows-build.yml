name: Windows Double & Single Precision Builds

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  VCPKG_COMMIT: dbe35ceb30c688bf72e952ab23778e009a578f18

jobs:
  double:
    name: Build Godot3DTiles Extension (Double Precision)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Checkout pinned vcpkg source
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        ref: ${{ env.VCPKG_COMMIT }}
        path: .ezvcpkg/${{ env.VCPKG_COMMIT }}
        fetch-depth: 1
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install SCons
      run: pip install scons

    - name: Setup MSVC 2022
      uses: microsoft/setup-msbuild@v1.3
      with:
        vs-version: '17.7'

    - name: Pre-setup vcpkg and globally disable MSYS2 pkgconfig fixups
      shell: powershell
      run: |
        $workspaceVcpkgDir = Join-Path $env:GITHUB_WORKSPACE ".ezvcpkg\$env:VCPKG_COMMIT"
        $driveRoot = [System.IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)
        $vcpkgRoot = Join-Path $driveRoot ".ezvcpkg"
        $vcpkgDir = Join-Path $vcpkgRoot $env:VCPKG_COMMIT
        $vcpkgArchive = Join-Path $env:RUNNER_TEMP "vcpkg-$env:VCPKG_COMMIT.tar"
        New-Item -ItemType Directory -Force -Path $vcpkgRoot | Out-Null

        if (-not (Test-Path $workspaceVcpkgDir)) {
            throw "Pinned vcpkg checkout not found at expected path: $workspaceVcpkgDir"
        }

        if (Test-Path $vcpkgDir) {
            Remove-Item -Recurse -Force $vcpkgDir
        }

        New-Item -ItemType Directory -Force -Path $vcpkgDir | Out-Null
        if (Test-Path $vcpkgArchive) {
            Remove-Item -Force $vcpkgArchive
        }

        tar -cf "$vcpkgArchive" -C "$workspaceVcpkgDir" .
        $archiveExitCode = $LASTEXITCODE
        if ($archiveExitCode -ne 0) {
            throw "tar archive failed with exit code $archiveExitCode"
        }

        tar -xf "$vcpkgArchive" -C "$vcpkgDir"
        $extractExitCode = $LASTEXITCODE
        if ($extractExitCode -ne 0) {
            throw "tar extract failed with exit code $extractExitCode"
        }
        $global:LASTEXITCODE = 0

        & "$env:GITHUB_WORKSPACE\.github\scripts\disable-vcpkg-fixup-pkgconfig.ps1" -VcpkgDir $vcpkgDir

    - name: Build Extension (Double Precision)
      run: scons platform=windows arch=x64 compileTarget=extension target=template_release buildCesium=true precision=double

    - name: Verify Build Output
      run: if ((gci godot3dtiles/addons/cesium_godot/lib -Filter "*.dll").Count -lt 1) { exit 1 }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: godot3dtiles-double-precision-dev
        path: godot3dtiles/

  single:
    name: Build Godot3DTiles Extension (Single Precision)
    runs-on: windows-latest
    needs: double

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Checkout pinned vcpkg source
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        ref: ${{ env.VCPKG_COMMIT }}
        path: .ezvcpkg/${{ env.VCPKG_COMMIT }}
        fetch-depth: 1
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install SCons
      run: pip install scons

    - name: Setup MSVC 2022
      uses: microsoft/setup-msbuild@v1.3
      with:
        vs-version: '17.7'

    - name: Pre-setup vcpkg and globally disable MSYS2 pkgconfig fixups
      shell: powershell
      run: |
        $workspaceVcpkgDir = Join-Path $env:GITHUB_WORKSPACE ".ezvcpkg\$env:VCPKG_COMMIT"
        $driveRoot = [System.IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)
        $vcpkgRoot = Join-Path $driveRoot ".ezvcpkg"
        $vcpkgDir = Join-Path $vcpkgRoot $env:VCPKG_COMMIT
        $vcpkgArchive = Join-Path $env:RUNNER_TEMP "vcpkg-$env:VCPKG_COMMIT.tar"
        New-Item -ItemType Directory -Force -Path $vcpkgRoot | Out-Null

        if (-not (Test-Path $workspaceVcpkgDir)) {
            throw "Pinned vcpkg checkout not found at expected path: $workspaceVcpkgDir"
        }

        if (Test-Path $vcpkgDir) {
            Remove-Item -Recurse -Force $vcpkgDir
        }

        New-Item -ItemType Directory -Force -Path $vcpkgDir | Out-Null
        if (Test-Path $vcpkgArchive) {
            Remove-Item -Force $vcpkgArchive
        }

        tar -cf "$vcpkgArchive" -C "$workspaceVcpkgDir" .
        $archiveExitCode = $LASTEXITCODE
        if ($archiveExitCode -ne 0) {
            throw "tar archive failed with exit code $archiveExitCode"
        }

        tar -xf "$vcpkgArchive" -C "$vcpkgDir"
        $extractExitCode = $LASTEXITCODE
        if ($extractExitCode -ne 0) {
            throw "tar extract failed with exit code $extractExitCode"
        }
        $global:LASTEXITCODE = 0

        & "$env:GITHUB_WORKSPACE\.github\scripts\disable-vcpkg-fixup-pkgconfig.ps1" -VcpkgDir $vcpkgDir

    - name: Build Extension (Single Precision)
      run: scons platform=windows arch=x64 compileTarget=extension target=template_release buildCesium=true precision=single

    - name: Verify Build Output
      run: if ((gci godot3dtiles/addons/cesium_godot/lib -Filter "*.dll").Count -lt 1) { exit 1 }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: godot3dtiles-single-precision-dev
        path: godot3dtiles/
